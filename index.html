<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#080b16" />
  <title>Task Tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="bg-orbs" aria-hidden="true">
    <span class="orb orb-1"></span>
    <span class="orb orb-2"></span>
    <span class="orb orb-3"></span>
  </div>

  <div class="container">
    <header class="top">
      <div class="brand">
        <div class="logo" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none"
               stroke="currentColor" stroke-width="2.5"
               stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 6 9 17l-5-5"/>
          </svg>
        </div>
        <div class="brand-text">
          <h1>Task Tracker</h1>
          <p class="subtitle">Локальный трекер для отслеживания проектов</p>
        </div>
      </div>
      <button id="themeBtn" class="icon-btn" aria-label="Сменить тему" title="Сменить тему" type="button">
        <svg class="i-sun" viewBox="0 0 24 24" width="20" height="20" fill="none"
             stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="4"/>
          <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>
        </svg>
        <svg class="i-moon" viewBox="0 0 24 24" width="20" height="20" fill="none"
             stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
        </svg>
      </button>
    </header>

    <section class="add-project glass">
      <div class="add-project-text">
        <strong>Ваши проекты</strong>
        <span>Создайте проект, задайте сроки — откройте его в новой вкладке</span>
      </div>
      <button id="newProjectBtn" class="btn-primary" type="button">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none"
             stroke="currentColor" stroke-width="3" stroke-linecap="round">
          <path d="M12 5v14M5 12h14"/>
        </svg>
        Новый проект
      </button>
    </section>

    <section id="projects" class="projects"></section>

    <footer class="foot">
      <button id="exportBtn" class="ghost" type="button">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none"
             stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 3v12M7 10l5 5 5-5M5 21h14"/>
        </svg>
        Экспорт
      </button>
      <button id="importBtn" class="ghost" type="button">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none"
             stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 21V9M7 14l5-5 5 5M5 3h14"/>
        </svg>
        Импорт
      </button>
      <button id="wipeBtn" class="ghost danger" type="button">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none"
             stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M6 6l1 14a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-14"/>
        </svg>
        Стереть всё
      </button>
      <input id="importFile" type="file" accept="application/json" hidden />
    </footer>
  </div>

  <dialog id="projectDialog" class="modal">
    <form id="projectForm" class="modal-inner" autocomplete="off">
      <h3 id="projectDialogTitle">Новый проект</h3>
      <label>
        <span>Название</span>
        <input id="pName" name="name" required autocomplete="off" placeholder="Например, Redesign сайта" />
      </label>
      <label>
        <span>Описание (необязательно)</span>
        <textarea id="pDesc" name="description" rows="2" placeholder="Кратко о чём проект"></textarea>
      </label>
      <div class="modal-row">
        <label>
          <span>Дата начала</span>
          <input id="pStart" name="start_date" type="date" />
        </label>
        <label>
          <span>Срок реализации</span>
          <input id="pEnd" name="end_date" type="date" />
        </label>
      </div>
      <div class="modal-actions">
        <button type="button" class="ghost" id="cancelProject">Отмена</button>
        <button type="submit" class="btn-primary">Сохранить</button>
      </div>
    </form>
  </dialog>

  <script src="app.js"></script>
  <script src="index.js"></script>
</body>
</html>
